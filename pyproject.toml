[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "replicator"
version = "0.1.0"
description = "Autonomous, evidence-first scientific replication"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "pymupdf>=1.26,<2",
  "pillow>=11.3,<12",
  "numpy>=2.3,<3",
  "google-cloud-firestore>=2.21,<3",
  "google-cloud-pubsub>=2.31,<3",
  "google-cloud-storage>=3.2,<4",
  "google-cloud-build>=3.31,<4",
  "google-cloud-run>=0.12,<1",
  "google-auth>=2.40,<3",
  "google-adk[gcp]>=2.0,<3",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["packages", "services"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
