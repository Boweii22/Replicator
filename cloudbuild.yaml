steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]
images: ["${_IMAGE}"]
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _IMAGE: europe-west1-docker.pkg.dev/${PROJECT_ID}/replicator/app:${SHORT_SHA}
